[package]
name = "carbide_registry"
version = "1.0.0"
description = "Permissionless on-chain registry of Carbide storage providers"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "carbide_registry"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
